project_id = "vietk"

# Cấu hình khi deploy bằng Supabase CLI.
# Các function tự kiểm tra đăng nhập/khoá bí mật bên trong, nên tắt kiểm tra JWT mặc định
# (bắt buộc cho webhook Telegram và cron).
[functions.cl-admin-users]
verify_jwt = false
[functions.cl-notify]
verify_jwt = false
[functions.cl-telegram]
verify_jwt = false
[functions.cl-ai]
verify_jwt = false

[auth]
enabled = true
# Địa chỉ 2 app trên GitHub Pages của VietK
site_url = "https://dattrinh-ai.github.io/vietk-checklist/"
additional_redirect_urls = ["https://dattrinh-ai.github.io/vietk-checklist/**", "https://dattrinh-ai.github.io/vietk-crm/**"]
enable_signup = false

[auth.email]
# true = cho phép ĐĂNG NHẬP bằng email (tự đăng ký đã bị chặn bởi [auth] enable_signup = false ở trên)
enable_signup = true
enable_confirmations = false
